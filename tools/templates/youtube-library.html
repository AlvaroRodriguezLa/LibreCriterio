<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Libre Criterio · Biblioteca audiovisual</title><style>
:root{color-scheme:light;--paper:#f2efe6;--ink:#252c27;--muted:#5c645b;--rule:#b5b9ad;--accent:#7b2924}*{box-sizing:border-box}body{overflow-wrap:anywhere;margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,sans-serif}a{color:inherit;text-underline-offset:3px}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}header{padding:25px 32px;border-bottom:1px solid var(--ink)}header a{text-decoration:none;font-size:15px;font-weight:bold;letter-spacing:.07em}h1{font:46px/1.1 Georgia,serif;margin:18px 0}header p{max-width:850px;color:var(--muted);font-size:14px}.stats{display:flex;flex-wrap:wrap;gap:20px;font-size:13px}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);max-width:1500px;margin:auto}aside{min-width:0;padding:25px;border-right:1px solid var(--rule)}label{display:grid;gap:6px;font-size:12px;margin-bottom:18px}input,select{width:100%;min-height:44px;border:1px solid var(--rule);background:transparent;padding:10px}#results{font-size:12px;color:var(--muted)}#videos{padding:0;list-style:none;max-height:65vh;overflow:auto}#videos button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);padding:15px 8px;background:transparent}#videos button[aria-current]{border-left:3px solid var(--accent);background:#e5e7dd}#videos strong{display:block;font:19px/1.3 Georgia,serif}#videos small{display:block;color:var(--muted);margin-top:8px;font-size:11px}main{padding:35px 45px;min-width:0}h2{font:38px/1.15 Georgia,serif;margin:0 0 20px}h3{font:27px/1.25 Georgia,serif;margin:30px 0 18px}.meta,.notice{font-size:13px;color:var(--muted)}.notice{padding:15px 20px;border-left:2px solid var(--accent);background:#e5e7dd}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.actions a,.actions button{border:1px solid var(--rule);padding:10px 14px;text-decoration:none;min-height:44px;background:transparent;font-size:13px}.item{border-top:1px solid var(--rule);padding:16px 0}.item p{margin:0 0 10px}.item .detail{font-size:13px;color:var(--muted)}.evidence{font-size:12px;color:var(--accent)}.tag{font-size:10px;display:inline-block;padding:3px 8px;border:1px solid var(--rule);margin-bottom:8px}.transcript{max-width:70ch;font:20px/1.7 Georgia,serif}.transcript p{padding-top:15px;border-top:1px solid var(--rule)}.transcript a{font:11px Arial,sans-serif;color:var(--accent);margin-right:12px}.empty{padding-block:30px;color:var(--muted)}details{border-top:1px solid var(--rule);padding:15px 0}summary{cursor:pointer;min-height:40px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}@media(max-width:850px){header{padding:20px}h1{font-size:38px}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--rule);padding:20px}#videos{max-height:280px}main{padding:30px 20px}h2{font-size:32px}}
</style></head><body><header><a href="#">↗ LIBRE CRITERIO · FUENTES</a><h1>Una biblioteca para entender.</h1><p>Vídeos por canal, transcripciones conservadas y argumentos con marcas de tiempo. Una transcripción automática puede equivocarse; una revisión textual no identifica por sí sola las voces de un debate o una reacción.</p><div class="stats" id="stats"></div></header><div class="layout"><aside><label>Buscar vídeo, tema o idea<input id="search" type="search" placeholder="Descentralización, pensiones, consentimiento…"></label><label>Canal<select id="channel"><option value="">Todos los canales</option></select></label><label>Estado<select id="state"><option value="">Todos</option><option value="reviewed">Con revisión textual</option><option value="downloaded">Con transcripción</option><option value="pending">Pendientes de transcripción</option></select></label><p id="results" role="status"></p><ol id="videos"></ol></aside><main id="detail"><p class="empty">Elige un vídeo.</p></main></div>
<script id="library-data" type="application/json">__LIBRARY_DATA__</script><script>
const data=JSON.parse(document.getElementById('library-data').textContent),byId=new Map(data.catalog.map(v=>[v.id,v]));let active=null;
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};const clock=value=>{let n=Math.floor(Number(value)||0);return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')};
const stats=document.getElementById('stats');[data.catalog.length+' vídeos',new Set(data.catalog.map(v=>v.channel?.id)).size+' canales',data.catalog.filter(v=>v.transcriptStatus==='downloaded').length+' transcripciones',Object.keys(data.analyses).length+' revisiones textuales'].forEach(v=>stats.append(text('span',v)));
for(const [id,name] of new Map(data.catalog.map(v=>[v.channel?.id||'unknown',v.channel?.name||'Por verificar']))){const option=text('option',name);option.value=id;document.getElementById('channel').append(option)}
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function filter(){const q=normalize(document.getElementById('search').value),channel=document.getElementById('channel').value,state=document.getElementById('state').value;const rows=data.catalog.filter(v=>(!q||normalize(JSON.stringify([v.title,v.topicsRequested,data.analyses[v.id]])).includes(q))&&(!channel||(v.channel?.id||'unknown')===channel)&&(!state||state==='reviewed'&&data.analyses[v.id]||state==='downloaded'&&v.transcriptStatus==='downloaded'||state==='pending'&&v.transcriptStatus!=='downloaded'));document.getElementById('results').textContent=rows.length+(rows.length===1?' vídeo':' vídeos');const list=document.getElementById('videos');list.replaceChildren();for(const v of rows){const li=document.createElement('li'),button=document.createElement('button');button.append(text('strong',v.title||v.id),text('small',(v.channel?.name||'Por verificar')+' · '+clock(v.duration)+' · '+(data.analyses[v.id]?'Revisión textual':v.transcriptStatus==='downloaded'?'Transcripción':'Pendiente')));if(v.id===active)button.setAttribute('aria-current','true');button.addEventListener('click',()=>show(v.id));li.append(button);list.append(li)}}
function entryText(item){if(typeof item==='string')return item;return item.idea||item.summary||item.description||item.title||item.name||item.role||item.claim||item.text||'Detalle'}
function renderItem(item,id,trans){const div=text('div','', 'item');if(typeof item==='string'){div.append(text('p',item));return div}if(item.assessment)div.append(text('span',{keep:'Argumento conservado',qualify:'Necesita matiz',reject:'Inferencia rechazada',needs_verification:'Dato por contrastar'}[item.assessment]||item.assessment,'tag'));div.append(text('p',entryText(item)));const labels={reason:'Evaluación',context:'Contexto',unit:'Unidad',period:'Periodo',verification:'Verificación',verificationStatus:'Estado del contraste',role:'Papel',confidence:'Confianza',position:'Postura',actorOrVoice:'Voz o autor de la idea',speakerId:'Identificador de voz',literalAsr:'Lectura automática',literalValue:'Valor transcrito',literalValues:'Valores transcritos',value:'Valor',values:'Cifras mencionadas',normalizedCandidate:'Posible corrección por contrastar',candidateNormalizedName:'Nombre candidato por contrastar',notes:'Notas',limit:'Límite de la comparación',qualification:'Matiz',scope:'Alcance',target:'Objeto de la crítica',function:'Función del ejemplo',asrReading:'Lectura automática',calculation:'Cálculo de comprobación'};for(const [key,label] of Object.entries(labels))if(item[key]!==undefined&&item[key]!==null)div.append(text('p',label+': '+(typeof item[key]==='object'?JSON.stringify(item[key]):String(item[key])),'detail'));const ids=item.evidenceSegmentIds||[],first=trans?.segments?.find(s=>s.id===ids[0]);const start=first?.start??item.start;if(start!==undefined){const a=text('a','Abrir fuente · '+clock(start),'evidence');a.href='https://www.youtube.com/watch?v='+id+'&t='+Math.floor(start);a.target='_blank';a.rel='noopener';div.append(a)}return div}
async function show(id){if(!byId.has(id))return;active=id;location.hash=id;filter();const v=byId.get(id),a=data.analyses[id],main=document.getElementById('detail');main.replaceChildren(text('p',v.channel?.name||'Canal por verificar','meta'),text('h2',v.title||id),text('p',clock(v.duration)+' · '+(v.transcript?.language||'Idioma pendiente')+' · '+(v.transcript?.method==='local_asr'?'Reconocimiento local automático · voces y cifras sin verificar':v.transcript?.isGenerated?'Subtítulos automáticos':'Pista por comprobar'),'meta'));const actions=text('div','','actions'),link=text('a','Ver vídeo ↗');link.href='https://www.youtube.com/watch?v='+id;link.target='_blank';link.rel='noopener';actions.append(link);if(v.transcriptStatus==='downloaded'){const source=text('a','Original con tiempos');source.href='videos/'+id+'/transcript.txt';actions.append(source)}main.append(actions);let trans=null;if(v.transcriptStatus==='downloaded'){try{trans=await (await fetch('videos/'+id+'/transcript.json')).json()}catch{main.append(text('p','Para abrir el texto dentro de esta página, usa el servidor local indicado en la guía. El archivo original sigue disponible.','notice'))}}if(active!==id)return;
if(a){main.append(text('p','Revisión completa del texto. La identidad de cada voz y las cifras que necesiten contraste se señalan en la ficha.','notice'));const sections={speakers:'Voces y atribuciones',narrativeSequence:'El recorrido del argumento',arguments:'Ideas y evaluación',examples:'Ejemplos',analogies:'Analogías y metáforas',statistics:'Cifras que deben contrastarse',criticisms:'Críticas',cases:'Casos concretos',liberalIdeas:'Ideas liberales',contradictionsOrLimits:'Límites y discrepancias',attributionWarnings:'Atribución de voces'};for(const [key,title]of Object.entries(sections)){if(!a[key]?.length)continue;const section=document.createElement('section');section.append(text('h3',title));for(const item of a[key])section.append(renderItem(item,id,trans));main.append(section)}const raw=document.createElement('details');raw.append(text('summary','Ficha completa y evidencias'),text('pre',JSON.stringify(a,null,2)));main.append(raw)}else main.append(text('p',v.transcriptStatus==='downloaded'?'Transcripción disponible. La extracción y revisión de argumentos aún está pendiente.':'La transcripción todavía no está disponible. No se atribuyen ideas a este vídeo a partir del título.','notice'));
if(trans){const details=document.createElement('details');details.append(text('summary','Leer transcripción completa'));const body=text('div','','transcript');for(const s of trans.segments){const p=text('p',''),anchor=text('a',clock(s.start));anchor.href='https://www.youtube.com/watch?v='+id+'&t='+Math.floor(s.start);anchor.target='_blank';anchor.rel='noopener';p.append(anchor,document.createTextNode(s.text));body.append(p)}details.append(body);main.append(details)}}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id)){if(id!==active)show(id)}else{active=null;filter();document.getElementById('detail').replaceChildren(text('p','Elige un vídeo.','empty'))}});
['search','channel','state'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',filter));filter();const initial=location.hash.slice(1);if(byId.has(initial))show(initial);
</script></body></html>
